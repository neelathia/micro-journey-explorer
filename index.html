<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Micro-Journey Explorer · Documentation Knowledge Graph</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0f1113;--panel:#171c21;--line:#35404b;--txt:#e6ebf3;--dim:#a3b0bd;--blue:#75a5ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui, sans-serif;overflow:hidden}
header{position:absolute;z-index:2;top:0;left:0;right:0;min-height:76px;background:#11171ef2;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 18px;gap:10px}
h1{font-size:18px;margin:0}header small{color:var(--dim)}button,select,input{background:#242e38;border:1px solid #495664;color:var(--txt);border-radius:8px;padding:9px;font:inherit}button{cursor:pointer}button:hover{border-color:var(--blue)}
.controls{display:flex;gap:8px;flex-wrap:wrap}svg{position:absolute;top:76px;left:0;width:100%;height:calc(100% - 76px);touch-action:none}
.links line{stroke:#718397;stroke-opacity:.33;stroke-width:1.4}.links line.cross{stroke:#69a6fd;stroke-dasharray:5 5;stroke-opacity:.6}.links line.faint{stroke-opacity:.04}.node{cursor:pointer}.node text{text-anchor:middle;fill:#dce6f4;paint-order:stroke;stroke:#11171e;stroke-width:3px;font-size:11px;pointer-events:none}.node.faint{opacity:.12}.node.selected circle{stroke:white;stroke-width:3}
aside{position:absolute;right:18px;top:92px;bottom:18px;width:335px;max-width:calc(100vw - 36px);overflow:auto;background:#171e26f5;border:1px solid #526072;border-radius:13px;padding:20px;display:none;z-index:3;box-shadow:0 12px 30px #0009}
aside h2{margin:10px 0;font-size:22px}aside p{color:var(--dim)}aside button{width:100%;text-align:left;margin:3px 0}
.tag{display:inline-block;border:1px solid #5d748b;border-radius:15px;padding:2px 8px;margin:3px;font-size:11px}
.cover{border-top:1px solid #374554;padding:9px 0}.cover strong{color:#9ec3ff}.cover div{font-size:12px;color:var(--dim)}
.help{position:absolute;left:14px;bottom:14px;max-width:420px;background:#192129ed;border:1px solid #384755;padding:12px;border-radius:10px;font-size:12px;color:var(--dim)}
@media(max-width:720px){header{padding:9px}header h1{font-size:14px}header small{font-size:10px}.controls{gap:4px}.controls>*{font-size:11px;padding:6px}svg{top:112px;height:calc(100% - 112px)}aside{top:123px}.help{max-width:245px}}
</style></head><body>
<header><div><h1>Micro-Journey Explorer</h1><small>A fictional documentation graph · Multiple ways into one connected experience</small></div><div class="controls"><input id="search" placeholder="Search tasks or sections" aria-label="Search" size="19"><select id="intent" aria-label="Filter by intent"><option value="all">All intents</option><option value="understand">Understand</option><option value="do">Do</option><option value="verify">Verify</option><option value="troubleshoot">Troubleshoot</option><option value="learn-more">Learn more</option></select><button id="reset">Reset view</button></div></header>
<svg id="graph" role="img" aria-label="Force-directed knowledge graph of macro journeys, micro journeys and task sections"></svg>
<aside id="panel"><button id="close" style="width:auto;float:right">Close ×</button><div id="detail"></div></aside>
<div class="help"><b style="color:#d7e4f4">Explore the knowledge graph</b><div>Click nodes to inspect. Drag to rearrange. Scroll to zoom. Filter by user intent to reveal where it is supported.</div><div style="margin-top:7px">● <span style="color:#e1ae66">Journey</span> · <span style="color:#83b7ff">Macro</span> · <span style="color:#9be2c4">Pages</span> · Sections in gray</div></div>
<script>
const intents=['understand','do','verify','troubleshoot','learn-more'];
const labels={'understand':'Understand','do':'Do','verify':'Verify','troubleshoot':'Troubleshoot','learn-more':'Learn more'};
const nodes=[],links=[];
function add(id,label,kind,parent,description,coverage){nodes.push({id,label,kind,parent,description:description||'',coverage:coverage||{}});if(parent)links.push({source:parent,target:id,type:'part-of'});}
add('root','Example platform journey','root',null,'Fictional self-service onboarding example.');
add('prepare','Prepare','macro','root');add('use','Start using the platform','macro','root');add('validate','Validate & maintain','macro','root');
add('setup','Set up your workspace','stage','prepare');add('account','Get access','page','setup','Request and confirm the access needed to begin.');
add('tokens','Configure authentication','page','setup');add('install','Install tools','page','setup');add('ready','Verify readiness','page','setup');
add('first','First task','page','use');add('run','Complete a workflow','page','use');add('result','Check results','page','validate');add('support','Resolve problems','page','validate');
function section(id,title,parent,coverage){add(id,title,'section',parent,'A fictional section demonstrating intent-to-content mapping.',coverage);}
const full=(topic)=>({understand:'Why '+topic+' matters and what it enables.',do:'Steps or a link to carry out '+topic+'.',verify:'Observable success check for '+topic+'.',troubleshoot:'Recovery guidance and support path.', 'learn-more':'Related explanation or deeper reference.'});
section('s-account','1. Platform account','account',full('platform account access'));
section('s-workspace','2. Workspace membership','account',{'understand':'How workspace membership differs from account access.','do':'Request membership in the intended workspace.','verify':'Confirm the workspace appears in the account.','troubleshoot':'Membership support route.'});
section('s-roles','3. Check permissions','account',{'understand':'What the required permission level means.','do':'Open role details and inspect assigned permissions.','verify':'Compare assigned permission with the required role.','troubleshoot':'Request an approved permissions change.','learn-more':'Role and permission reference.'});
section('s-tool','4. Tool access','account',{'understand':'Why the tooling needs separate authorization.','do':'Use the approved sample tool-access request.','verify':'Open the tooling workspace after provisioning.','troubleshoot':'Follow the request support procedure.'});
for(const [id,parent,title] of [['s-token','tokens','Create credentials'],['s-token-check','tokens','Confirm authentication'],['s-install','install','Install dependencies'],['s-check','ready','Run readiness check'],['s-first','first','Begin your first task'],['s-execute','run','Execute the workflow'],['s-result','result','Validate the outcome'],['s-help','support','Diagnose a problem']])section(id,title,parent,full(title.toLowerCase()));
[['account','tokens','related task'],['tokens','install','dependency'],['install','ready','dependency'],['ready','first','next task'],['first','run','next task'],['run','result','verification'],['result','support','when blocked'],['support','ready','retry'],['s-token-check','s-check','verify in setup'],['s-account','s-roles','related access checks'],['s-check','s-help','if check fails'],['s-result','s-execute','retry']].forEach(x=>links.push({source:x[0],target:x[1],type:'cross',label:x[2]}));
const by=Object.fromEntries(nodes.map(n=>[n.id,n]));const colors={root:'#e7b771',macro:'#7dabff',stage:'#af93ef',page:'#69c9b0',section:'#a2acb7'},radii={root:34,macro:27,stage:23,page:17,section:10};
const svg=d3.select('#graph'),world=svg.append('g'),edges=world.append('g').attr('class','links').selectAll('line').data(links).join('line').attr('class',d=>d.type==='cross'?'cross':'');
const point=world.append('g').selectAll('g').data(nodes).join('g').attr('class','node');
point.append('circle').attr('r',d=>radii[d.kind]).attr('fill',d=>colors[d.kind]).attr('fill-opacity',.88);
point.append('text').attr('dy',d=>radii[d.kind]+15).text(d=>d.label);
point.append('title').text(d=>d.label);
const zoom=d3.zoom().scaleExtent([.2,4]).on('zoom',e=>world.attr('transform',e.transform));svg.call(zoom);
const w=()=>innerWidth,h=()=>innerHeight-80;const reset=()=>svg.transition().duration(400).call(zoom.transform,d3.zoomIdentity.translate(w()*.48,h()*.48).scale(.8));reset();
const sim=d3.forceSimulation(nodes).force('link',d3.forceLink(links).id(d=>d.id).distance(d=>d.type==='cross'?150:d.target.kind==='section'?72:132).strength(d=>d.type==='cross'?.07:.55)).force('charge',d3.forceManyBody().strength(d=>d.kind==='root'?-1500:d.kind==='macro'?-1100:d.kind==='page'?-540:-125)).force('collision',d3.forceCollide(d=>radii[d.kind]+28)).force('center',d3.forceCenter(0,0)).alphaDecay(.025);
point.call(d3.drag().on('start',(e,d)=>{if(!e.active)sim.alphaTarget(.25).restart();d.fx=d.x;d.fy=d.y}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y}).on('end',(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
sim.on('tick',()=>{edges.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);point.attr('transform',d=>'translate('+d.x+','+d.y+')')});
let current=null;
function lineage(d){const a=[d.id];let x=d;while(x.parent&&by[x.parent]){x=by[x.parent];a.push(x.id)}return a}
function render(){const intent=document.getElementById('intent').value,query=document.getElementById('search').value.toLowerCase().trim(),seen=new Set();
for(const n of nodes.filter(n=>n.kind==='section'&&(intent==='all'||Object.hasOwn(n.coverage,intent))&&(!query||n.label.toLowerCase().includes(query)||by[n.parent]?.label.toLowerCase().includes(query))))lineage(n).forEach(v=>seen.add(v));
if(!query&&intent==='all')nodes.forEach(n=>seen.add(n.id));
point.classed('faint',d=>!seen.has(d.id)).classed('selected',d=>current?.id===d.id);
edges.classed('faint',d=>!seen.has(d.source.id)||!seen.has(d.target.id));
}
function openNode(d){current=d;const child=nodes.filter(n=>n.parent===d.id);let out='<div style="font-size:11px;letter-spacing:.1em;color:#a3c6fc;text-transform:uppercase">'+d.kind+'</div><h2>'+d.label+'</h2><p>'+d.description+'</p>';if(d.kind==='section'){out+='<b>Five user intents · illustrative coverage</b>';for(const i of intents){out+='<div class="cover"><strong>'+labels[i]+'</strong><div>'+(d.coverage[i]||'Not mapped for this example')+'</div></div>'}}else{out+='<b>Contains</b>';for(const n of child)out+='<button data-id="'+n.id+'">'+n.label+'</button>';if(d.kind==='page'){const sec=child.filter(n=>n.kind==='section');out+='<p>Intents inherited from '+sec.length+' sections: '+intents.filter(i=>sec.some(s=>s.coverage[i])).map(i=>'<span class="tag">'+labels[i]+'</span>').join('')+'</p>'}}out+='<p style="font-size:11px">This is a fictional demonstration, not verified product documentation or user-test evidence.</p>';document.getElementById('detail').innerHTML=out;document.getElementById('panel').style.display='block';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openNode(by[b.dataset.id]));render();}
point.on('click',(e,d)=>{e.stopPropagation();openNode(d)});svg.on('click',()=>{current=null;document.getElementById('panel').style.display='none';render()});document.getElementById('close').onclick=()=>{current=null;document.getElementById('panel').style.display='none';render()};document.getElementById('intent').onchange=render;document.getElementById('search').oninput=render;document.getElementById('reset').onclick=()=>{document.getElementById('intent').value='all';document.getElementById('search').value='';current=null;document.getElementById('panel').style.display='none';render();reset()};
render();
</script></body></html>
